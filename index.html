<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071024">
  <meta name="description" content="Fares Abdel3aziz — Creative Director, Cinematic & Visual Storyteller">
  <title>Fares Abdel3aziz — Creative Director & Cinematic Visual Storyteller</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#071024;overflow:hidden}
    #loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;background:#071024;color:#f7f8fc;font:600 14px/1.5 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;transition:opacity .35s ease}
    #loading::before{content:"";width:44px;height:44px;border:3px solid rgba(76,218,237,.18);border-top-color:#4cdaed;border-radius:50%;animation:spin .8s linear infinite;position:absolute;margin-top:-58px}
    #loading.hidden{opacity:0;pointer-events:none}
    iframe{display:block;width:100%;height:100%;border:0;background:#071024}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loading">Opening Portfolio</div>
  <iframe id="portfolio" src="https://fares-ai-portfolio.fow2sh.chatgpt.site/" title="Fares Abdel3aziz Portfolio" allow="autoplay; fullscreen; picture-in-picture; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const frame=document.getElementById('portfolio');
    const loading=document.getElementById('loading');
    frame.addEventListener('load',()=>setTimeout(()=>loading.classList.add('hidden'),250));
    setTimeout(()=>loading.classList.add('hidden'),8000);
  </script>
</body>
</html>
